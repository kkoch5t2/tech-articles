<text x="100" y="1420" font-size="26" fill="#536982" font-weight="400" text-anchor="start">ルート：VPC localのみ（IGW / NATなし）</text>
<text x="100" y="1465" font-size="26" fill="#536982" font-weight="400" text-anchor="start">Endpoint：Lambda SGからTCP 3128を許可</text>
<text x="100" y="1510" font-size="26" fill="#536982" font-weight="400" text-anchor="start">HTTPSは明示的にプロキシを指定</text>
<text x="100" y="1555" font-size="26" fill="#536982" font-weight="400" text-anchor="start">SSHのインバウンド開放なし</text>
