<text x="1900" y="1495" font-size="24" fill="#536982" font-weight="400" text-anchor="middle">両EC2のログを共通バケットへ</text>
<text x="1900" y="1535" font-size="24" fill="#536982" font-weight="400" text-anchor="middle">非公開・暗号化・自動削除なし</text>
