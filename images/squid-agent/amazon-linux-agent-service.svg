<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
<defs><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8Z" fill="#2C68B2"/></marker><marker id="o" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8Z" fill="#C96B16"/></marker></defs>
<rect width="1800" height="1120" fill="white"/>
<g font-family="Noto Sans CJK JP,Yu Gothic,sans-serif">
<text x="55" y="65" font-size="38" fill="#18324D" font-weight="700" text-anchor="start">Amazon Linux 2023でKinesis Agentを動かす仕組み</text>
<text x="55" y="110" font-size="22" fill="#60758A" font-weight="400" text-anchor="start">CloudFormationのUserDataで導入し、systemdで常駐サービスとして管理</text>
<rect x="55" y="160" width="520" height="165" rx="12" fill="#F3F7FC" stroke="#2C68B2" stroke-width="2"/>
<text x="80" y="205" font-size="26" fill="#2C68B2" font-weight="700" text-anchor="start">1. パッケージ導入</text>
<text x="80" y="248" font-size="23" fill="#18324D" font-weight="400" text-anchor="start">Squid / aws-kinesis-agent</text>
<text x="80" y="284" font-size="23" fill="#18324D" font-weight="400" text-anchor="start">Java：Corretto 17</text>
<rect x="640" y="160" width="520" height="165" rx="12" fill="#F3F7FC" stroke="#2C68B2" stroke-width="2"/>
<text x="665" y="205" font-size="26" fill="#2C68B2" font-weight="700" text-anchor="start">2. 設定・権限を作成</text>
<text x="665" y="248" font-size="23" fill="#18324D" font-weight="400" text-anchor="start">agent.json / systemd unit</text>
<text x="665" y="284" font-size="23" fill="#18324D" font-weight="400" text-anchor="start">Squidログの読み取り権限</text>
<rect x="1225" y="160" width="520" height="165" rx="12" fill="#F3F7FC" stroke="#2C68B2" stroke-width="2"/>
<text x="1250" y="205" font-size="26" fill="#2C68B2" font-weight="700" text-anchor="start">3. 自動起動を有効化</text>
<text x="1250" y="248" font-size="23" fill="#18324D" font-weight="400" text-anchor="start">systemctl enable --now</text>
<text x="1250" y="284" font-size="23" fill="#18324D" font-weight="400" text-anchor="start">SquidとKinesis Agent</text>
<path d="M575 242 H640" fill="none" stroke="#2C68B2" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#b)"/>
<path d="M1160 242 H1225" fill="none" stroke="#2C68B2" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#b)"/>
<rect x="55" y="385" width="1690" height="650" rx="12" fill="#F7FBF9" stroke="#AED5CC" stroke-width="2"/>
<text x="80" y="429" font-size="27" fill="#238576" font-weight="700" text-anchor="start">EC2 / Amazon Linux 2023</text>
<rect x="100" y="470" width="1600" height="85" rx="12" fill="#F0F6FD" stroke="#2C68B2" stroke-width="2"/>
<text x="900" y="522" font-size="28" fill="#2C68B2" font-weight="700" text-anchor="middle">systemd：SquidとKinesis Agentの起動・停止・再起動を管理</text>
<rect x="120" y="635" width="360" height="125" rx="12" fill="#FFFFFF" stroke="#238576" stroke-width="2"/>
<text x="300" y="685" font-size="30" fill="#238576" font-weight="700" text-anchor="middle">Squid</text>
<text x="300" y="726" font-size="22" fill="#60758A" font-weight="400" text-anchor="middle">プロキシ通信のログを出力</text>
<rect x="625" y="635" width="390" height="125" rx="12" fill="#FFFFFF" stroke="#B2C4D6" stroke-width="2"/>
<text x="820" y="685" font-size="23" fill="#18324D" font-weight="700" text-anchor="middle">/var/log/squid/access.log</text>
<text x="820" y="726" font-size="22" fill="#60758A" font-weight="400" text-anchor="middle">アクセスのたびに追記</text>
<rect x="1160" y="635" width="520" height="125" rx="12" fill="#FFF8EE" stroke="#C96B16" stroke-width="2"/>
<text x="1420" y="685" font-size="30" fill="#C96B16" font-weight="700" text-anchor="middle">Kinesis Agent</text>
<text x="1420" y="726" font-size="23" fill="#60758A" font-weight="400" text-anchor="middle">Java（Corretto 17）で実行</text>
<path d="M300 555 V635" fill="none" stroke="#2C68B2" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#b)"/>
<path d="M1420 555 V635" fill="none" stroke="#2C68B2" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#b)"/>
<path d="M480 697 H625" fill="none" stroke="#C96B16" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#o)"/>
<text x="553" y="674" font-size="20" fill="#C96B16" font-weight="400" text-anchor="middle">出力</text>
<path d="M1015 697 H1160" fill="none" stroke="#C96B16" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#o)"/>
<text x="1087" y="674" font-size="20" fill="#C96B16" font-weight="400" text-anchor="middle">監視・収集</text>
<rect x="120" y="825" width="850" height="165" rx="12" fill="#FFFFFF" stroke="#B2C4D6" stroke-width="2"/>
<text x="145" y="865" font-size="23" fill="#18324D" font-weight="700" text-anchor="start">UserDataで作成する設定ファイル</text>
<text x="145" y="907" font-size="21" fill="#60758A" font-weight="400" text-anchor="start">/etc/aws-kinesis/agent.json</text>
<text x="145" y="947" font-size="21" fill="#60758A" font-weight="400" text-anchor="start">/etc/systemd/system/aws-kinesis-agent.service</text>
<rect x="1120" y="825" width="560" height="165" rx="12" fill="#FFF9F2" stroke="#E7CBA8" stroke-width="2"/>
<text x="1400" y="869" font-size="25" fill="#C96B16" font-weight="700" text-anchor="middle">チェックポイント</text>
<text x="1400" y="910" font-size="19" fill="#18324D" font-weight="400" text-anchor="middle">/var/lib/aws-kinesis-agent/checkpoints</text>
<text x="1400" y="950" font-size="22" fill="#60758A" font-weight="400" text-anchor="middle">再起動後も読み取り位置を引き継ぐ</text>
<path d="M1420 760 V825" fill="none" stroke="#C96B16" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#o)"/>
<text x="1510" y="797" font-size="19" fill="#C96B16" font-weight="400" text-anchor="start">進捗を保存</text>
<text x="55" y="1080" font-size="23" fill="#60758A" font-weight="400" text-anchor="start">Kinesis AgentはSquidログを読み取り、Firehose用Endpointへ送信する。</text>
</g></svg>