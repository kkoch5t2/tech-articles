name: Zennの公開用ブランチを同期

on:
  push:
    branches: [main]
    paths:
      - 'zenn/**'
      - '.github/workflows/sync-zenn.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zenn-deploy
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: mainを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: zenn-deployの直下に原稿を同期
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git fetch --no-tags origin refs/heads/zenn-deploy
          deploy_commit=$(git rev-parse FETCH_HEAD)
          source_tree=$(git rev-parse HEAD:zenn)
          if [ "$source_tree" = "$(git rev-parse "$deploy_commit^{tree}")" ]; then
            exit 0
          fi

          source_commit=$(git rev-parse --short HEAD)
          new_commit=$(git commit-tree "$source_tree" -p "$deploy_commit" -m "chore: Zennの原稿を同期 ($source_commit)")
          git push origin "$new_commit:refs/heads/zenn-deploy"
